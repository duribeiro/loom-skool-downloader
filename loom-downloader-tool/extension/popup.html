<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  :root{
    --accent:#3D7BFF; --accent-2:#00E0C6; --ok:#25C26E; --bad:#FF5A5A;
    --bg:#FFFFFF; --surface:#F6F7FB; --line:#DDE2EE;
    --ink:#141826; --muted:#5C647C; --faint:#8A93AD;
    --radius:12px; --radius-sm:10px;
    --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#171B2E; --surface:#1E2338; --line:#2A3149;
      --ink:#E7EAF3; --muted:#9AA3BE; --faint:#6C769A;
    }
  }
  *{box-sizing:border-box}
  body{ width:320px; margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); }

  .head{ display:flex; align-items:center; gap:10px; padding:13px 15px; border-bottom:1px solid var(--line); }
  .mk{ width:26px; height:26px; border-radius:8px; flex:none; display:grid; place-items:center;
       background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
  .mk svg{ width:15px; height:15px; }
  .head b{ font-size:14px; font-weight:750; letter-spacing:-.01em; }
  .status{ margin-left:auto; display:inline-flex; align-items:center; gap:6px;
           font-size:11px; color:var(--muted); font-family:var(--mono); }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--faint); }
  .dot.on{ background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent); }
  .dot.off{ background:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent); }

  .body{ padding:15px; display:flex; flex-direction:column; gap:14px; }

  .ctx{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; }
  .ctx .k{ font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--faint); font-family:var(--mono); }
  .ctx .v{ font-size:14px; font-weight:700; margin:3px 0 10px; }
  .ctx .sub{ font-size:11.5px; color:var(--muted); margin:-6px 0 10px; line-height:1.45; }
  .btn.mini{ margin-top:7px; padding:8px; font-size:12px; font-weight:600; }

  .field label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.1em;
                color:var(--faint); font-family:var(--mono); margin-bottom:6px; }
  .field input{ width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--line);
                background:var(--bg); color:var(--ink); font-size:13px; font-family:var(--mono); }
  .field input::placeholder{ color:var(--faint); }

  .btn{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
        padding:11px; border-radius:var(--radius-sm); border:none; cursor:pointer;
        font-family:var(--sans); font-weight:700; font-size:13.5px; color:#fff;
        background:linear-gradient(180deg,#4a83ff,#2f6bff); box-shadow:0 6px 16px rgba(47,107,255,.30); }
  .btn:hover{ filter:brightness(1.06); }
  .btn:disabled{ opacity:.6; cursor:default; filter:none; }
  .btn svg{ width:16px; height:16px; }
  .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none; }

  /* Atalho discreto: colar link é o caso RARO (o normal é baixar da aba atual),
     então ele fica recolhido atrás deste botão em vez de ocupar o popup inteiro. */
  .link-toggle{ display:flex; align-items:center; gap:8px; width:100%; padding:9px 11px;
                border:1px solid var(--line); border-radius:var(--radius-sm);
                background:transparent; color:var(--muted); cursor:pointer;
                font-family:var(--sans); font-size:12.5px; font-weight:650; }
  .link-toggle:hover{ color:var(--ink); border-color:var(--faint); }
  .link-toggle svg{ width:17px; height:17px; flex:none; }

  /* ATENÇÃO à especificidade: `#blocoColar{display:flex}` (0,1,0,0) VENCE
     `.hidden{display:none}` (0,0,1,0), e o bloco nunca ficava escondido.
     Por isso o estado colapsado é declarado no próprio ID. */
  #blocoColar{ display:flex; flex-direction:column; gap:10px; }
  #blocoColar.hidden{ display:none; }

  .divider{ height:1px; background:var(--line); }
  .hint{ font-size:11.5px; color:var(--muted); min-height:15px; white-space:pre-line; line-height:1.5; }
  .hidden{ display:none; }
</style>
</head>
<body>

  <div class="head">
    <span class="mk">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v9.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M7.5 9.8 12 14.3l4.5-4.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 19h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    </span>
    <b>Sifão</b>
    <span class="status"><span id="dot" class="dot"></span><span id="statusTxt">verificando…</span></span>
  </div>

  <div class="body">

    <div id="ctxCurso" class="ctx hidden">
      <div class="k">Curso detectado na aba</div>
      <div class="v" id="cursoNome">—</div>
      <button class="btn" id="btnCurso">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16M4 12h16M4 19h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="btnCursoTxt">Baixar curso inteiro</span>
      </button>
    </div>

    <div id="ctxComunidade" class="ctx hidden">
      <div class="k">Comunidade detectada na aba</div>
      <div class="v" id="comuNome">—</div>
      <div class="sub" id="comuResumo"></div>
      <button class="btn" id="btnComu">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h7M4 12h7M4 18h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M17 5v9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M14 11.8 17 14.8 20 11.8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="btnComuTxt">Baixar todos os cursos</span>
      </button>
      <button class="btn ghost mini hidden" id="btnComuCancel">Cancelar</button>
    </div>

    <button class="link-toggle" id="btnAbrirColar">
      <svg viewBox="0 0 24 24" fill="none"><rect x="1.5" y="5" width="21" height="14" rx="4.2" fill="#FF0033"/><path d="M10 8.9v6.2l5.4-3.1z" fill="#fff"/></svg>
      <span>Baixar do YouTube — colar link</span>
    </button>

    <div id="blocoColar" class="hidden">
      <div class="field">
        <label for="url">Link do YouTube</label>
        <input id="url" type="text" placeholder="https://youtube.com/watch?v=…" autocomplete="off">
      </div>
      <button class="btn ghost" id="btnYt">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v10.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M7.5 9.5 12 14l4.5-4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 19h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>Baixar vídeo colado</span>
      </button>
    </div>

    <div class="divider"></div>
    <div id="hint" class="hint"></div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
