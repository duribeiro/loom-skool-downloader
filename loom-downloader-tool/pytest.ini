[pytest]
testpaths = tests

# Os testes de rede ficam FORA da execucao padrao.
# Eles dependem da internet e de o Loom estar no ar, entao nao podem
# derrubar a suite normal. Rode-os de proposito com:  pytest -m rede
addopts = -m "not rede"

markers =
    rede: bate no Loom de verdade; detecta quando ELES mudam algo (pytest -m rede)
